name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Webhook
        run: |
          curl -s -X POST https://k-goz-mac-8.tailfaf66c.ts.net/api/deploy-webhook \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            --max-time 120
          echo "Deploy triggered"